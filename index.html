<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal POS — Demo Client (HTML mandiri)</title>
<style>
:root{--primary:#2563EB;--dark:#1D4ED8;--soft:#EFF6FF;--line:#E2E8F0;--ink:#0F172A;--bg:#F8FAFC;--ok:#16A34A;--okbg:#DCFCE7;--warn:#D97706;--warnbg:#FEF3C7;--bad:#DC2626;--badbg:#FEE2E2}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.tnum{font-variant-numeric:tabular-nums}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EFF6FF,#DBEAFE);padding:20px}
.login-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;max-width:640px;width:100%;box-shadow:0 12px 32px -20px rgba(15,23,42,.25)}
.role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.role{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff}.role.on{border-color:var(--primary);background:var(--soft)}
.role b{display:block}.role small{color:#64748B}
#app{display:none;min-height:100vh}
aside{position:sticky;top:0;height:100vh;width:228px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;float:left}
aside .brand{padding:16px;display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
nav{flex:1;overflow-y:auto;padding:0 10px 10px}
nav p{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#94A3B8;margin:12px 6px 4px}
nav button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:600;color:#475569;cursor:pointer;text-align:left}
nav button.on{background:var(--primary);color:#fff}nav button:not(.on):hover{background:var(--soft)}
.main{margin-left:228px;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:10px;align-items:center;z-index:5}
.content{padding:18px;max-width:1100px;width:100%;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -20px rgba(15,23,42,.22);padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.kpi.acc{border-color:var(--primary);background:var(--soft)}
.kpi small{color:#64748B}.kpi b.tnum{font-size:18px;display:block;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--soft);color:var(--dark)}input,select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit}
.btn{background:var(--primary);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:13px}.btn:active{transform:scale(.98)}
.ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;font-weight:700;font-size:12.5px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:800}.ok{background:var(--okbg);color:var(--ok)}.warnb{background:var(--warnbg);color:var(--warn)}.badb{background:var(--badbg);color:var(--bad)}.info{background:var(--soft);color:var(--dark)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 330px;gap:12px}@media(max-width:950px){.grid2{grid-template-columns:1fr}aside{display:none}.main{margin-left:0}}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff;cursor:pointer;text-align:left;font-family:inherit}.item:hover{border-color:var(--primary)}
.flow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.flow .f{min-width:150px;border:1px solid var(--line);border-radius:14px;padding:10px;background:#F1F5F9}.flow .f.end{background:var(--primary);color:#fff;border-color:var(--primary)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px}.bars div{flex:1;border-radius:6px;background:rgba(37,99,235,.15)}.bars div.pk{background:var(--primary)}
.note{font-size:12px;color:#64748B}.hide{display:none!important}
h2{margin:0 0 4px;font-size:16px}h3{margin:0 0 8px;font-size:14px}
</style>
</head>
<body>
<div id="login"><div class="login-card">
<div class="row"><div class="logo">S</div><div><b style="font-size:18px">Signal POS</b><br><small class="note">Demo client — pilih peran untuk masuk. Tanpa server, tanpa internet.</small></div></div>
<div class="role-grid" id="roles"></div>
<div class="row"><div style="flex:1"><small class="note">Username</small><br><input id="l-user" value="admin" style="width:100%"></div>
<div style="flex:1"><small class="note">Password</small><br><input id="l-pass" type="password" value="admin123" style="width:100%"></div>
<div style="flex:1"><small class="note">Cabang</small><br><select id="l-branch" style="width:100%"></select></div></div>
<p><button class="btn" style="width:100%;padding:12px" onclick="doLogin()">Masuk</button></p>
<p class="note" id="l-err" style="color:var(--bad)"></p>
<p class="note">Akun demo: <code>admin/admin123</code> (Admin) &bull; <code>braga/cabang123</code> (Manajer Braga) &bull; <code>kasir/kasir123</code> (Kasir Dago). Data tersimpan lokal di browser (<code>signalpos:*</code>).</p>
</div></div>

<div id="app">
<aside><div class="brand"><div class="logo">S</div><div><b>Signal POS</b><br><small class="note">Backoffice &bull; demo</small></div></div>
<nav id="nav"></nav>
<div style="padding:12px;border-top:1px solid var(--line)"><button class="btn" style="width:100%" onclick="show('pos')">Buka POS Kasir</button>
<button class="ghost" style="width:100%;margin-top:8px" onclick="logout()">Keluar</button></div></aside>
<div class="main"><header class="top">
<select id="branch" onchange="setBranch(this.value)"></select>
<span class="badge info">Demo lokal</span>
<span style="margin-left:auto" class="row"><span class="badge info" id="who"></span></span></header>
<div class="content" id="view"></div></div>
</div>

<script>
var SEED_BRANCH = [
{id:"semua",nama:"Semua Cabang",alamat:"Agregat 4 outlet",warna:"#0F172A",status:"Buka",trx:348,omzet:12450000,kas:8450000},
{id:"c1",nama:"Cabang 1 — Dago",alamat:"Jl. Ir. H. Juanda No. 88",warna:"#2563EB",status:"Buka",trx:96,omzet:3420000,kas:2150000},
{id:"c2",nama:"Cabang 2 — Braga",alamat:"Jl. Braga No. 12",warna:"#0284C7",status:"Buka",trx:128,omzet:4860000,kas:3240000},
{id:"c3",nama:"Cabang 3 — Cihampelas",alamat:"Jl. Cihampelas No. 45",warna:"#4F46E5",status:"Buka",trx:74,omzet:2610000,kas:1780000},
{id:"c4",nama:"Cabang 4 — Buah Batu",alamat:"Jl. Buah Batu No. 203",warna:"#64748B",status:"Tutup",trx:0,omzet:0,kas:1280000}];
var SEED_P = [["p1","Kebab Beef Small","KBB-BEF-S","Kebab",15000,8200,42],["p2","Kebab Beef Medium","KBB-BEF-M","Kebab",20000,10800,38],["p3","Kebab Beef Large","KBB-BEF-L","Kebab",25000,13250,51],["p4","Kebab Chicken","KBB-CHK-01","Kebab",18000,9400,27],["p5","Cheese Kebab","KBB-CHS-01","Kebab",23000,12400,19],["p6","Double Meat Kebab","KBB-DM-01","Kebab",32000,18900,12],["p7","Kebab Combo","CMB-01","Combo",35000,19200,22],["p8","Fries","SNK-FRS-01","Fries",12000,4800,60],["p9","Air Mineral","MNM-01","Minuman",5000,2200,120],["p10","Soft Drink","MNM-02","Minuman",8000,4100,88],["p11","Extra Cheese","ADD-CHS","Add-on",5000,3100,200],["p12","Extra Meat","ADD-MET","Add-on",7000,5200,150]];
var SEED_B = [["Beef","BB-BEF","gram",8400,10000,75],["Chicken","BB-CHK","gram",15200,8000,42],["Tortilla","BB-TRT","pcs",320,100,2500],["Lettuce","BB-LTC","gram",2100,2000,18],["Tomato","BB-TMT","gram",1800,2000,14],["Onion","BB-ONN","gram",1600,1500,12],["Cheese","BB-CHS","gram",900,1200,155],["Garlic Sauce","BB-GRL","gram",4300,2000,32],["Packaging","KM-PAK","pcs",410,200,1400]];
var SEED_S = [["TRX-20261004-00192","Cabang 2 — Braga","Andi","19:42",55000,28500,"QRIS"],["TRX-20261004-00191","Cabang 1 — Dago","Sinta","19:35",43000,21600,"Tunai"],["TRX-20261004-00190","Cabang 2 — Braga","Andi","19:21",25000,13250,"QRIS"],["TRX-20261004-00189","Cabang 3 — Cihampelas","Budi","19:12",67000,34800,"E-wallet"]];
var DEMO = [{u:"admin",p:"admin123",nama:"Administrator",role:"admin",cab:null},{u:"braga",p:"cabang123",nama:"Manajer Braga",role:"cabang",cab:"c2"},{u:"kasir",p:"kasir123",nama:"Kasir Dago",role:"kasir",cab:"c1"}];
var RESEP = [["Tortilla","1 pcs",2500],["Beef","100 gram",7500],["Lettuce","30 gram",540],["Tomato","20 gram",280],["Onion","15 gram",180],["Saus","25 gram",800],["Mayones","15 gram",450],["Packaging","1 pcs",1400]];

function load(k,f){try{var r=localStorage.getItem(k);return r?JSON.parse(r):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var S = {
branches: load("signalpos:branches", SEED_BRANCH),
products: load("signalpos:products", SEED_P.map(function(p){return {id:p[0],nama:p[1],sku:p[2],kategori:p[3],harga:p[4],hpp:p[5],stok:p[6],status:"Aktif"};})),
ingredients: load("signalpos:ingredients", SEED_B.map(function(b){return {nama:b[0],sku:b[1],satuan:b[2],stok:b[3],minimum:b[4],hargaRata:b[5],cabang:"Cabang 2"};})),
sales: load("signalpos:sales", SEED_S.map(function(s){return {id:s[0],cabang:s[1],kasir:s[2],jam:s[3],total:s[4],hpp:s[5],laba:s[4]-s[5],bayar:s[6],status:"LUNAS"};})),
branch: load("signalpos:branch", "c2"),
pembelian: load("signalpos:demo:pembelian", [{id:"PO-001",bahan:"Beef 5kg",total:375000,tgl:"2026-10-03",status:"Diterima"},{id:"PO-002",bahan:"Tortilla 200pcs",total:500000,tgl:"2026-10-04",status:"Diproses"}]),
pengeluaran: load("signalpos:demo:pengeluaran", [{nama:"Gaji shift pagi",total:850000,tgl:"2026-10-04"},{nama:"Gas LPG 2 tabung",total:360000,tgl:"2026-10-03"},{nama:"Listrik",total:890000,tgl:"2026-10-02"}]),
transfer: load("signalpos:demo:transfer", [{id:"TF-001",dari:"Cabang 2 — Braga",ke:"Cabang 1 — Dago",bahan:"Tortilla 50pcs",status:"Selesai"}]),
opname: load("signalpos:demo:opname", [{bahan:"Beef",sistem:8400,fisik:8350,tgl:"2026-10-04"}]),
waste: load("signalpos:demo:waste", [{bahan:"Lettuce 200gr",alasan:"Layu",tgl:"2026-10-04"}]),
supplier: load("signalpos:demo:supplier", [{nama:"PT Daging Segar",kontak:"0812-000-111",produk:"Beef, Chicken"},{nama:"Toko Kemas Barokah",kontak:"0812-000-222",produk:"Packaging, Tortilla"}]),
pengguna: load("signalpos:demo:pengguna", [{nama:"Administrator",user:"admin",role:"admin"},{nama:"Manajer Braga",user:"braga",role:"cabang"},{nama:"Kasir Dago",user:"kasir",role:"kasir"}]),
shift: load("signalpos:demo:shift", {buka:true,kasAwal:500000,kasir:"Andi"}),
audit: load("signalpos:demo:audit", [{waktu:"2026-10-04 08:00",aksi:"Shift dibuka — Andi"}]),
tax: 5,
session: load("signalpos:session", null)
};
function persist(){save("signalpos:branches",S.branches);save("signalpos:products",S.products);save("signalpos:ingredients",S.ingredients);save("signalpos:sales",S.sales);save("signalpos:branch",S.branch);save("signalpos:demo:pembelian",S.pembelian);save("signalpos:demo:pengeluaran",S.pengeluaran);save("signalpos:demo:transfer",S.transfer);save("signalpos:demo:opname",S.opname);save("signalpos:demo:waste",S.waste);save("signalpos:demo:supplier",S.supplier);save("signalpos:demo:pengguna",S.pengguna);save("signalpos:demo:shift",S.shift);save("signalpos:demo:audit",S.audit);}
function log(aksi){var d=new Date();S.audit.unshift({waktu:d.toLocaleString("id-ID"),aksi:aksi});persist();}
function rp(n){return "Rp"+Math.round(n).toLocaleString("id-ID");}
function bname(id){for(var i=0;i<S.branches.length;i++){if(S.branches[i].id===id)return S.branches[i].nama;}return id;}
function esc(s){return String(s).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;");}
function sum(arr,fn){return arr.reduce(function(s,r){return s+fn(r);},0);}

var GROUPS = [["Utama",[["dashboard","◧","Dashboard"],["pos","◈","POS Kasir"],["penjualan","≡","Penjualan"]]],
["Katalog",[["produk","○","Produk"],["resep","◎","Resep & HPP"],["bahan","⬡","Bahan Baku"]]],
["Operasional",[["stok","▤","Stok"],["pembelian","▣","Pembelian"],["transfer","⇄","Transfer"],["opname","◐","Opname"],["waste","△","Waste"]]],
["Keuangan",[["pengeluaran","–","Pengeluaran"],["shift","◑","Shift & Kas"],["laporan","▥","Laporan"],["profit","▲","Profitabilitas"]]],
["Sistem",[["cabang","⬣","Cabang"],["pengguna","◍","Pengguna"],["supplier","◇","Supplier"],["pengaturan","✦","Pengaturan"],["audit","☰","Audit Log"]]]];
var cur = "dashboard", posCat = "Semua", posQ = "", cart = {};
function role(){return S.session ? S.session.role : "admin";}
function allowed(v){var r=role();if(r==="kasir")return v==="pos"||v==="penjualan";if(r==="cabang")return v!=="pengguna"&&v!=="pengaturan";return true;}
function nav(){var h="";GROUPS.forEach(function(g){var items=g[1].filter(function(it){return allowed(it[0]);});if(!items.length)return;h+=`<p>${g[0]}</p>`;items.forEach(function(it){h+=`<button class="${cur===it[0]?"on":""}" onclick="show('${it[0]}')">${it[1]} ${it[2]}</button>`;});});document.getElementById("nav").innerHTML=h;}
function show(v){if(!allowed(v))v="pos";cur=v;nav();var R={dashboard:vDash,pos:vPos,penjualan:vJual,produk:vProduk,resep:vResep,bahan:vBahan,stok:vStok,pembelian:vBeli,transfer:vTf,opname:vOp,waste:vWaste,pengeluaran:vKeluar,shift:vShift,laporan:vLap,profit:vProfit,cabang:vCab,pengguna:vUser,supplier:vSup,pengaturan:vSet,audit:vAudit};document.getElementById("view").innerHTML=(R[v]||vDash)();if(v==="pos")renCart();}
function setBranch(id){S.branch=id;persist();show(cur);}
function head(t,d){return `<div class="card"><h2>${t}</h2><p class="note">${d}</p></div>`;}

function vDash(){
var men=S.ingredients.filter(function(b){return b.stok<=b.minimum;});
var om=sum(S.sales,function(r){return r.total;}), hpp=sum(S.sales,function(r){return r.hpp;}), kel=sum(S.pengeluaran,function(r){return r.total;});
var cards=[["Penjualan (demo)",rp(om),S.sales.length+" transaksi","acc"],["HPP",rp(hpp),"Food cost "+Math.round(hpp/Math.max(om,1)*100)+"%",""],["Laba Kotor",rp(om-hpp),"Margin "+Math.round((om-hpp)/Math.max(om,1)*100)+"%",""],["Pengeluaran",rp(kel),S.pengeluaran.length+" pos",""],["Laba Bersih",rp(om-hpp-kel),"Setelah operasional","acc"],["Stok Menipis",men.length+" bahan","Perlu pembelian",""]];
var k=`<div class="kpis">`+cards.map(function(x){return `<div class="kpi ${x[3]}"><small>${x[0]}</small><b class="tnum">${x[1]}</b><small>${x[2]}</small></div>`;}).join("")+`</div>`;
var bars=[42,58,51,66,74,88,62].map(function(v,i){return `<div style="height:${v}%" class="${i===5?"pk":""}"></div>`;}).join("");
var low=men.length?men.slice(0,5).map(function(b){return `<p class="row" style="justify-content:space-between"><b>${esc(b.nama)}</b><span class="tnum note">${b.stok} ${esc(b.satuan)}</span></p>`;}).join(""):`<p class="badge ok">Semua stok aman</p>`;
var flows=[["Penjualan Kotor",om,""],["Diskon & Refund",-2500000,""],["Pendapatan Bersih",om-2500000,""],["HPP",-hpp,""],["Laba Kotor",om-2500000-hpp,""],["Operasional",-kel,""],["Laba Bersih",om-2500000-hpp-kel,"end"]];
var fl=flows.map(function(f){return `<div class="f ${f[2]}"><small>${f[0]}</small><br><b class="tnum">${rp(f[1])}</b></div>`;}).join("");
return head("Ringkasan Bisnis","Memantau "+esc(bname(S.branch))+" — "+S.sales.length+" transaksi masuk otomatis dari POS.")
+`<div class="card">${k}</div>`
+`<div class="card"><h3>Alur Keuangan</h3><div class="flow">${fl}</div></div>`
+`<div class="grid2"><div class="card"><h3>Penjualan 7 Hari</h3><div class="bars">${bars}</div><p class="note">S S R K J S M — puncak hari Sabtu.</p></div>`
+`<div class="card"><h3>Stok Menipis <span class="badge warnb">${men.length} bahan</span></h3>${low}<p><button class="ghost" onclick="show('bahan')">Kelola bahan baku</button></p></div></div>`;
}

function posCats(){var m={};S.products.forEach(function(p){if(p.status==="Aktif")m[p.kategori]=(m[p.kategori]||0)+1;});return Object.keys(m).map(function(k){return [k,m[k]];});}
function vPos(){
var c=posCats();
var list=S.products.filter(function(p){return p.status==="Aktif"&&(posCat==="Semua"||p.kategori===posCat)&&p.nama.toLowerCase().indexOf(posQ.toLowerCase())>=0;});
var cats=c.map(function(x){return `<button class="ghost" onclick="posCat='${x[0]}';show('pos')">${x[0]} (${x[1]})</button>`;}).join("");
var items=list.map(function(p){return `<button class="item" onclick="addToCart('${p.id}')"><b>${esc(p.nama)}</b><br><small>${p.sku} — ${p.kategori}</small><br><b class="tnum">${rp(p.harga)}</b> <small class="tnum">stok ${p.stok}</small></button>`;}).join("")||`<p class="note">Tidak ada produk.</p>`;
return `<div class="grid2"><div><div class="card row"><input placeholder="Cari produk" value="${esc(posQ)}" oninput="posQ=this.value;refreshPosList()" style="flex:1;min-width:140px"><button class="ghost" onclick="posCat='Semua';show('pos')">All</button>${cats}</div>`
+`<div class="menu" id="posmenu">${items}</div></div>`
+`<div class="card"><h3>Order — ${esc(bname(S.branch))}</h3><div id="cart"></div><p class="tnum" id="ptotal"></p><div class="row"><select id="bayar"><option>QRIS</option><option>Tunai</option><option>E-wallet</option><option>Kartu</option></select><button class="btn" onclick="bayar()">Bayar</button></div><p class="note">Pajak ${S.tax}% — kasir: ${esc(S.session?S.session.nama:"-")}</p></div></div>`;
}
function refreshPosList(){var box=document.getElementById("posmenu");if(!box)return;var keep=cur;show("pos");var inp=document.querySelector("#view input");if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}}
function prod(id){for(var i=0;i<S.products.length;i++){if(S.products[i].id===id)return S.products[i];}return null;}
function addToCart(id){cart[id]=(cart[id]||0)+1;renCart();}
function chCart(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renCart();}
function renCart(){var box=document.getElementById("cart");if(!box)return;var ids=Object.keys(cart),sub=0;var h=ids.map(function(id){var p=prod(id);if(!p)return "";var s=p.harga*cart[id];sub+=s;return `<p class="row" style="justify-content:space-between"><span>${esc(p.nama)} × ${cart[id]}</span><span class="tnum">${rp(s)} <button class="ghost" onclick="chCart('${id}',1)">+</button> <button class="ghost" onclick="chCart('${id}',-1)">−</button></span></p>`;}).join("");box.innerHTML=h||`<p class="note">Klik produk untuk menambah.</p>`;var tot=Math.round(sub*(1+S.tax/100));document.getElementById("ptotal").innerHTML=`Subtotal ${rp(sub)} — Pajak ${S.tax}% — <b>Total ${rp(tot)}</b>`;}
function bayar(){var ids=Object.keys(cart);if(!ids.length){alert("Keranjang kosong.");return;}var sub=0,hpp=0;ids.forEach(function(id){var p=prod(id);sub+=p.harga*cart[id];hpp+=p.hpp*cart[id];p.stok=Math.max(0,p.stok-cart[id]);});var tot=Math.round(sub*(1+S.tax/100));var d=new Date();var id="TRX-"+d.toISOString().slice(0,10).split("-").join("")+"-"+Math.floor(100+Math.random()*900);var by=document.getElementById("bayar").value;S.sales.unshift({id:id,cabang:bname(S.branch),kasir:S.session?S.session.nama:"Kasir",jam:d.toTimeString().slice(0,5),total:tot,hpp:hpp,laba:tot-hpp,bayar:by,status:"LUNAS"});cart={};log("POS "+id+" — "+rp(tot)+" ("+by+")");persist();show("pos");alert("Lunas: "+id+" — "+rp(tot));}

function vJual(){var om=sum(S.sales,function(r){return r.total;});var rows=S.sales.map(function(s){return `<tr><td>${s.id}</td><td>${esc(s.cabang)}</td><td>${esc(s.kasir)}</td><td>${s.jam}</td><td>${s.bayar}</td><td>${rp(s.total)}</td><td>${rp(s.laba)}</td><td><span class="badge ok">${s.status}</span></td></tr>`;}).join("");return head("Penjualan",S.sales.length+" transaksi — omzet "+rp(om))+`<div class="card"><table class="tnum"><tr><th>ID</th><th>Cabang</th><th>Kasir</th><th>Jam</th><th>Bayar</th><th>Total</th><th>Laba</th><th>Status</th></tr>${rows}</table></div>`;}

function vProduk(){var rows=S.products.map(function(p){return `<tr><td><b>${esc(p.nama)}</b></td><td>${p.sku}</td><td>${p.kategori}</td><td>${rp(p.harga)}</td><td>${rp(p.hpp)}</td><td>${p.stok}</td><td><span class="badge ${p.status==="Aktif"?"ok":"info"}">${p.status}</span></td><td><button class="ghost" onclick="pTog('${p.id}')">Aktif/Non</button> <button class="ghost" onclick="pDel('${p.id}')">Hapus</button></td></tr>`;}).join("");return head("Produk","Katalog awal — tambah, nonaktifkan, atau hapus.")+`<div class="card row"><input id="np-n" placeholder="Nama produk"><input id="np-h" type="number" placeholder="Harga" style="width:120px"><input id="np-s" type="number" placeholder="Stok" style="width:90px"><button class="btn" onclick="pAdd()">Tambah</button></div><div class="card"><table class="tnum"><tr><th>Nama</th><th>SKU</th><th>Kategori</th><th>Harga</th><th>HPP</th><th>Stok</th><th>Status</th><th></th></tr>${rows}</table></div>`;}
function pAdd(){var n=document.getElementById("np-n").value.trim(),hh=Math.round(Number(document.getElementById("np-h").value)||0),ss=Math.round(Number(document.getElementById("np-s").value)||20);if(!n||!(hh>=0)){alert("Nama + harga wajib.");return;}S.products.unshift({id:"p"+Date.now(),nama:n,sku:"SKU-"+String(Date.now()).slice(-5),kategori:"Kebab",harga:hh,hpp:0,stok:ss,status:"Aktif"});log("Produk baru: "+n);persist();show("produk");}
function pTog(id){S.products.forEach(function(p){if(p.id===id)p.status=(p.status==="Aktif"?"Nonaktif":"Aktif");});persist();show("produk");}
function pDel(id){S.products=S.products.filter(function(p){return p.id!==id;});persist();show("produk");}

function vResep(){var rows=S.products.map(function(p){var m=p.harga?Math.round(p.hpp/p.harga*100):0;return `<tr><td><b>${esc(p.nama)}</b></td><td>${p.sku}</td><td>${rp(p.hpp)}</td><td>${rp(p.harga)}</td><td class="tnum">${m}%</td><td><span class="badge ${m<=45?"ok":"warnb"}">${m<=45?"Sehat":"Tinggi"}</span></td></tr>`;}).join("");var rr=RESEP.map(function(r){return `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${rp(r[2])}</td></tr>`;}).join("");var tot=sum(RESEP,function(r){return r[2];});return head("Resep & HPP","Food cost per produk + resep standar Kebab Large.")+`<div class="card"><table class="tnum"><tr><th>Produk</th><th>SKU</th><th>HPP</th><th>Harga</th><th>Food Cost</th><th></th></tr>${rows}</table></div><div class="card"><h3>Resep standar — Kebab Beef Large</h3><table class="tnum"><tr><th>Bahan</th><th>Jumlah</th><th>Biaya</th></tr>${rr}</table><p class="note">Total biaya resep: <b class="tnum">${rp(tot)}</b></p></div>`;}

function vBahan(){var men=S.ingredients.filter(function(b){return b.stok<=b.minimum;});var rows=S.ingredients.map(function(b){var low=b.stok<=b.minimum;return `<tr><td><b>${esc(b.nama)}</b></td><td>${b.sku}</td><td>${b.stok} ${esc(b.satuan)}</td><td>${b.minimum}</td><td>${rp(b.hargaRata)}</td><td><span class="badge ${low?"warnb":"ok"}">${low?"Menipis":"Aman"}</span></td><td><button class="ghost" onclick="bDel('${b.sku}')">Hapus</button></td></tr>`;}).join("");return head("Bahan Baku",S.ingredients.length+" bahan — "+men.length+" menipis.")+`<div class="card row"><input id="nb-n" placeholder="Nama bahan"><input id="nb-s" type="number" placeholder="Stok" style="width:90px"><input id="nb-m" type="number" placeholder="Minimum" style="width:100px"><button class="btn" onclick="bAdd()">Tambah</button></div><div class="card"><table class="tnum"><tr><th>Nama</th><th>SKU</th><th>Stok</th><th>Min</th><th>Harga Rata</th><th>Status</th><th></th></tr>${rows}</table></div>`;}
function bAdd(){var n=document.getElementById("nb-n").value.trim(),s=Number(document.getElementById("nb-s").value)||0,m=Number(document.getElementById("nb-m").value)||0;if(!n){alert("Nama wajib.");return;}S.ingredients.unshift({nama:n,sku:"BB-"+String(Date.now()).slice(-4),satuan:"gram",stok:s,minimum:m,hargaRata:0,cabang:bname(S.branch)});log("Bahan baru: "+n);persist();show("bahan");}
function bDel(sku){S.ingredients=S.ingredients.filter(function(b){return b.sku!==sku;});persist();show("bahan");}

function vStok(){var a=S.products.map(function(p){return `<tr><td>${esc(p.nama)}</td><td>${p.stok}</td><td><span class="badge ${p.stok<=10?"badb":p.stok<=20?"warnb":"ok"}">${p.stok<=10?"Kritis":p.stok<=20?"Menipis":"Aman"}</span></td></tr>`;}).join("");var b=S.ingredients.map(function(x){return `<tr><td>${esc(x.nama)}</td><td>${x.stok} ${esc(x.satuan)}</td><td><span class="badge ${x.stok<=x.minimum?"warnb":"ok"}">${x.stok<=x.minimum?"Menipis":"Aman"}</span></td></tr>`;}).join("");return head("Stok","Status produk + bahan dalam satu layar.")+`<div class="grid2"><div class="card"><h3>Produk</h3><table class="tnum"><tr><th>Produk</th><th>Stok</th><th>Status</th></tr>${a}</table></div><div class="card"><h3>Bahan</h3><table class="tnum"><tr><th>Bahan</th><th>Stok</th><th>Status</th></tr>${b}</table></div></div>`;}

function vBeli(){var rows=S.pembelian.map(function(p){return `<tr><td>${p.id}</td><td>${esc(p.bahan)}</td><td>${rp(p.total)}</td><td>${p.tgl}</td><td><span class="badge info">${p.status}</span></td></tr>`;}).join("");return head("Pembelian","Purchase order bahan ke supplier.")+`<div class="card row"><input id="po-b" placeholder="Bahan, mis. Beef 5kg"><input id="po-t" type="number" placeholder="Total Rp" style="width:130px"><button class="btn" onclick="poAdd()">Buat PO</button></div><div class="card"><table class="tnum"><tr><th>ID</th><th>Bahan</th><th>Total</th><th>Tgl</th><th>Status</th></tr>${rows}</table></div>`;}
function poAdd(){var b=document.getElementById("po-b").value||"-",t=Number(document.getElementById("po-t").value)||0;S.pembelian.unshift({id:"PO-"+String(Date.now()).slice(-4),bahan:b,total:t,tgl:new Date().toISOString().slice(0,10),status:"Diproses"});log("PO baru: "+b);persist();show("pembelian");}

function vTf(){var rows=S.transfer.map(function(t){return `<tr><td>${t.id}</td><td>${esc(t.dari)}</td><td>${esc(t.ke)}</td><td>${esc(t.bahan)}</td><td><span class="badge info">${t.status}</span></td></tr>`;}).join("");var opts=S.branches.filter(function(b){return b.id!=="semua";}).map(function(b){return `<option>${b.nama}</option>`;}).join("");return head("Transfer","Mutasi bahan antar cabang.")+`<div class="card row"><input id="tf-b" placeholder="Bahan, mis. Tortilla 50pcs"><select id="tf-k">${opts}</select><button class="btn" onclick="tfAdd()">Kirim</button></div><div class="card"><table><tr><th>ID</th><th>Dari</th><th>Ke</th><th>Bahan</th><th>Status</th></tr>${rows}</table></div>`;}
function tfAdd(){var b=document.getElementById("tf-b").value||"-",k=document.getElementById("tf-k").value;S.transfer.unshift({id:"TF-"+String(Date.now()).slice(-4),dari:bname(S.branch),ke:k,bahan:b,status:"Diproses"});log("Transfer: "+b+" ke "+k);persist();show("transfer");}

function vOp(){var rows=S.opname.map(function(o){return `<tr><td>${esc(o.bahan)}</td><td>${o.sistem}</td><td>${o.fisik}</td><td>${o.fisik-o.sistem}</td><td>${o.tgl}</td></tr>`;}).join("");return head("Opname","Cek fisik vs sistem.")+`<div class="card row"><input id="op-b" placeholder="Bahan"><input id="op-f" type="number" placeholder="Stok fisik" style="width:120px"><button class="btn" onclick="opAdd()">Simpan</button></div><div class="card"><table class="tnum"><tr><th>Bahan</th><th>Sistem</th><th>Fisik</th><th>Selisih</th><th>Tgl</th></tr>${rows}</table></div>`;}
function opAdd(){var b=document.getElementById("op-b").value||"-",f=Number(document.getElementById("op-f").value)||0;S.opname.unshift({bahan:b,sistem:0,fisik:f,tgl:new Date().toISOString().slice(0,10)});log("Opname: "+b);persist();show("opname");}

function vWaste(){var rows=S.waste.map(function(w){return `<tr><td>${esc(w.bahan)}</td><td>${esc(w.alasan)}</td><td>${w.tgl}</td></tr>`;}).join("");return head("Waste","Bahan terbuang.")+`<div class="card row"><input id="w-b" placeholder="Bahan + jumlah"><input id="w-a" placeholder="Alasan"><button class="btn" onclick="wAdd()">Catat</button></div><div class="card"><table><tr><th>Bahan</th><th>Alasan</th><th>Tgl</th></tr>${rows}</table></div>`;}
function wAdd(){var b=document.getElementById("w-b").value||"-",a=document.getElementById("w-a").value||"-";S.waste.unshift({bahan:b,alasan:a,tgl:new Date().toISOString().slice(0,10)});log("Waste: "+b);persist();show("waste");}

function vKeluar(){var t=sum(S.pengeluaran,function(r){return r.total;});var rows=S.pengeluaran.map(function(p){return `<tr><td>${esc(p.nama)}</td><td>${rp(p.total)}</td><td>${p.tgl}</td></tr>`;}).join("");return head("Pengeluaran","Total "+rp(t))+`<div class="card row"><input id="k-n" placeholder="Keperluan"><input id="k-t" type="number" placeholder="Nominal Rp" style="width:140px"><button class="btn" onclick="kAdd()">Tambah</button></div><div class="card"><table class="tnum"><tr><th>Keperluan</th><th>Nominal</th><th>Tgl</th></tr>${rows}</table></div>`;}
function kAdd(){var n=document.getElementById("k-n").value||"-",t=Number(document.getElementById("k-t").value)||0;S.pengeluaran.unshift({nama:n,total:t,tgl:new Date().toISOString().slice(0,10)});log("Pengeluaran: "+n+" "+rp(t));persist();show("pengeluaran");}

function vShift(){var s=S.shift;var kas=(S.branches.filter(function(b){return b.id===S.branch;})[0]||{kas:0}).kas;return head("Shift & Kas","Kelola shift kasir + posisi kas.")+`<div class="card"><p>Status: <span class="badge ${s.buka?"ok":"info"}">${s.buka?"Shift BUKA":"Shift TUTUP"}</span> — Kasir: <b>${esc(s.kasir)}</b> — Kas awal: <b class="tnum">${rp(s.kasAwal)}</b></p><p><button class="btn" onclick="shTog()">${s.buka?"Tutup Shift":"Buka Shift"}</button></p><p class="note">Cabang: ${esc(bname(S.branch))} — Kas cabang: <b class="tnum">${rp(kas)}</b></p></div>`;}
function shTog(){S.shift.buka=!S.shift.buka;log(S.shift.buka?"Shift dibuka":"Shift ditutup");persist();show("shift");}

function vLap(){var om=sum(S.sales,function(r){return r.total;}),hpp=sum(S.sales,function(r){return r.hpp;}),kel=sum(S.pengeluaran,function(r){return r.total;});var rows=[["Penjualan Kotor",om],["Diskon",-2000000],["Refund",-500000],["Pendapatan Bersih",om-2500000],["HPP",-hpp],["Laba Kotor",om-2500000-hpp],["Biaya Operasional",-kel],["Laba Bersih",om-2500000-hpp-kel]];var h=rows.map(function(r){return `<p class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0"><span>${r[0]}</span><b class="tnum">${rp(r[1])}</b></p>`;}).join("");return head("Laporan Laba Rugi","Bulan Ini — "+esc(bname(S.branch))+" — angka mengikuti transaksi demo.")+`<div class="card">${h}<p><span class="badge info">Margin Kotor ${Math.round((om-2500000-hpp)/Math.max(om,1)*100)}%</span> <span class="badge info">Margin Bersih ${Math.round((om-2500000-hpp-kel)/Math.max(om,1)*100)}%</span></p></div>`;}

function vProfit(){var rows=S.products.map(function(p){var m=p.harga?Math.round((p.harga-p.hpp)/p.harga*100):0;return `<tr><td><b>${esc(p.nama)}</b></td><td>${rp(p.harga)}</td><td>${rp(p.hpp)}</td><td>${rp(p.harga-p.hpp)}</td><td><span class="badge ${m>=50?"ok":m>=30?"info":"warnb"}">${m}%</span></td></tr>`;}).join("");return head("Profitabilitas","Pendapatan, HPP, laba dan margin per produk.")+`<div class="card"><table class="tnum"><tr><th>Produk</th><th>Harga</th><th>HPP</th><th>Laba/unit</th><th>Margin</th></tr>${rows}</table></div>`;}

function vCab(){var rows=S.branches.map(function(b){var btn=b.id!=="semua"?`<button class="ghost" onclick="cabTog('${b.id}')">Buka/Tutup</button>`:"";return `<tr><td><b>${esc(b.nama)}</b></td><td>${esc(b.alamat)}</td><td><span class="badge ${b.status==="Buka"?"ok":"info"}">${b.status}</span></td><td>${b.trx}</td><td>${rp(b.omzet)}</td><td>${rp(b.kas)}</td><td>${btn}</td></tr>`;}).join("");return head("Cabang","4 outlet + agregat.")+`<div class="card"><table class="tnum"><tr><th>Cabang</th><th>Alamat</th><th>Status</th><th>Trx</th><th>Omzet</th><th>Kas</th><th></th></tr>${rows}</table></div>`;}
function cabTog(id){S.branches.forEach(function(x){if(x.id===id)x.status=(x.status==="Buka"?"Tutup":"Buka");});persist();show("cabang");}

function vUser(){var rows=S.pengguna.map(function(u){return `<tr><td>${esc(u.nama)}</td><td>${u.user}</td><td><span class="badge info">${u.role}</span></td></tr>`;}).join("");return head("Pengguna","Kelola akun demo.")+`<div class="card"><table><tr><th>Nama</th><th>Username</th><th>Role</th></tr>${rows}</table></div>`;}

function vSup(){var rows=S.supplier.map(function(s){return `<tr><td>${esc(s.nama)}</td><td>${esc(s.kontak)}</td><td>${esc(s.produk)}</td></tr>`;}).join("");return head("Supplier","Rekanan bahan.")+`<div class="card row"><input id="sp-n" placeholder="Nama supplier"><input id="sp-k" placeholder="Kontak"><button class="btn" onclick="spAdd()">Tambah</button></div><div class="card"><table><tr><th>Nama</th><th>Kontak</th><th>Produk</th></tr>${rows}</table></div>`;}
function spAdd(){var n=document.getElementById("sp-n").value||"-",k=document.getElementById("sp-k").value||"-";S.supplier.unshift({nama:n,kontak:k,produk:"-"});log("Supplier baru: "+n);persist();show("supplier");}

function vSet(){return head("Pengaturan","Preferensi demo.")+`<div class="card"><p>Pajak POS (%)</p><p class="row"><input id="set-tax" type="number" value="${S.tax}" style="width:100px"><button class="btn" onclick="setTax()">Simpan</button></p><p class="note">Cabang aktif: ${esc(bname(S.branch))}</p><p><button class="ghost" onclick="resetDemo()">Reset semua data demo</button></p></div>`;}
function setTax(){S.tax=Math.max(0,Number(document.getElementById("set-tax").value)||0);persist();show("pengaturan");}
function resetDemo(){if(!confirm("Kembalikan ke data demo?"))return;Object.keys(localStorage).filter(function(k){return k.indexOf("signalpos:")===0;}).forEach(function(k){localStorage.removeItem(k);});location.reload();}

function vAudit(){var rows=S.audit.map(function(a){return `<tr><td class="tnum">${esc(a.waktu)}</td><td>${esc(a.aksi)}</td></tr>`;}).join("");return head("Audit Log",S.audit.length+" peristiwa tercatat lokal.")+`<div class="card"><table><tr><th>Waktu</th><th>Aktivitas</th></tr>${rows}</table></div>`;}

var loginRole = "admin";
function renRoles(){var R=[["admin","Admin","Semua cabang dan laporan","admin","admin123"],["cabang","Manajer Cabang","1 cabang + laporannya","braga","cabang123"],["kasir","Kasir","Hanya POS 1 cabang","kasir","kasir123"]];document.getElementById("roles").innerHTML=R.map(function(r){return `<div class="role ${loginRole===r[0]?"on":""}" onclick="pickRole('${r[0]}','${r[3]}','${r[4]}')"><b>${r[1]}</b><small>${r[2]}</small></div>`;}).join("");var sb=document.getElementById("l-branch");sb.innerHTML=S.branches.filter(function(b){return b.id!=="semua";}).map(function(b){return `<option value="${b.id}">${b.nama}</option>`;}).join("");sb.value=S.branch;}
function pickRole(r,u,p){loginRole=r;document.getElementById("l-user").value=u;document.getElementById("l-pass").value=p;renRoles();}
function roleLbl(r){return r==="admin"?"Admin":r==="cabang"?"Manajer Cabang":"Kasir";}
function doLogin(){var u=document.getElementById("l-user").value.trim().toLowerCase(),p=document.getElementById("l-pass").value;var f=null;DEMO.forEach(function(d){if(d.u===u&&d.p===p)f=d;});if(!f){document.getElementById("l-err").textContent="Username atau password salah. (demo: admin/admin123)";return;}var cab=(f.role==="admin")?null:(document.getElementById("l-branch").value||f.cab);S.session={nama:f.nama,username:f.u,role:f.role,cabangId:cab,token:"demo."+Date.now()};if(cab)S.branch=cab;save("signalpos:session",S.session);persist();enter();}
function enter(){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";document.getElementById("who").textContent=S.session.nama+" — "+roleLbl(S.session.role);var sb=document.getElementById("branch");sb.innerHTML=S.branches.map(function(b){return `<option value="${b.id}">${b.nama}</option>`;}).join("");sb.value=S.branch;cur=(S.session.role==="kasir")?"pos":"dashboard";show(cur);}
function logout(){localStorage.removeItem("signalpos:session");S.session=null;location.reload();}
renRoles();
if(S.session&&S.session.username){enter();}
</script>
</body>
</html>
